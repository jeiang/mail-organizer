[package]
name = "mail-organizer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.17"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
mail-parser = "0.11"
maud = { version = "0.27", features = ["axum"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# Same release line and features as garret: HTTP/protobuf only, the blocking
# reqwest client on the batch processor's own thread.
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace", "internal-logs"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
